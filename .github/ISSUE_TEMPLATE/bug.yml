name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Heat pump model / family
      description: For example iTec, Genesis, Atlas, Diplomat
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: Attach the downloaded diagnostics (redacted). Remove anything personal from logs before pasting.
