name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.14
          uv pip install -r requirements_test.txt
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        # client/ and catalog/ appear in roadmap Phase 2/3
        run: |
          if [ -d custom_components/thermia_cloud/client ]; then uv run mypy; fi
      - name: Test
        run: uv run pytest -q
