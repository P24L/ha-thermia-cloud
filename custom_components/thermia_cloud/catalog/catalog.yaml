# Curated register knowledge. Format and rules: docs/CATALOG.md
# Everything not listed here still works through the generic planner rules.
version: 1

devices:
  main: {}
  circuit_1: {translation_key: device_circuit_1}
  circuit_2: {translation_key: device_circuit_2}
  pool: {translation_key: device_pool}

groups:
  REG_GROUP_HEATING_CURVE: {device: main}
  REG_GROUP_HEATING_CURVE_CIRC1: {device: circuit_1}
  REG_GROUP_HEATING_CURVE_CIRC2: {device: circuit_2}
  REG_GROUP_POOL: {device: pool}
  REG_GROUP_OPERATIONAL_TIME: {device: main, category: diagnostic}
  # other families name the second/first circuit's groups differently (older-cloud dumps)
  REG_GROUP_HEATING_CURVE1: {device: circuit_1}
  REG_GROUP_HEATING_CURVE2: {device: circuit_2}
  REG_GROUP_HEATING_CURVE_2: {device: circuit_2}
  REG_GROUP_DEFROSTING: {device: main, category: diagnostic}
  REG_GROUP_DEFROSTS: {device: main, category: diagnostic}

registers:
  # --- heating curves (the same names exist in the main and the circuit-1 group) ---
  REG_HEATING_HEAT_CURVE:
    kind: number
    unit: "°C"
    device_class: temperature
    icon: mdi:chart-bell-curve
    default_enabled: true
    risk: heating
    translation_key: heating_curve
    shared: true
    state_dependent: true
  REG_HEATING_HEAT_CURVE_MIN:
    kind: number
    translation_key: heating_curve_min
    unit: "°C"
    device_class: temperature
    risk: heating
    shared: true
    state_dependent: true
  REG_HEATING_HEAT_CURVE_MAX:
    kind: number
    translation_key: heating_curve_max
    unit: "°C"
    device_class: temperature
    risk: heating
    shared: true
    state_dependent: true

  # main circuit (the heat pump device itself); the plain entries above serve circuit 1
  REG_GROUP_HEATING_CURVE/REG_HEATING_HEAT_CURVE:
    kind: number
    unit: "°C"
    device_class: temperature
    icon: mdi:chart-bell-curve
    default_enabled: true
    risk: heating
    translation_key: heating_curve_main
  REG_GROUP_HEATING_CURVE/REG_HEATING_HEAT_CURVE_MIN:
    kind: number
    unit: "°C"
    device_class: temperature
    risk: heating
    translation_key: heating_curve_min_main
  REG_GROUP_HEATING_CURVE/REG_HEATING_HEAT_CURVE_MAX:
    kind: number
    unit: "°C"
    device_class: temperature
    risk: heating
    translation_key: heating_curve_max_main

  REG_HEATING_HEAT_STOP:
    kind: number
    translation_key: heating_stop
    unit: "°C"
    device_class: temperature
    risk: heating

  # Only returned by the cloud while circuit 1 is in *Constant* mode (the curve registers vanish
  # then). The cloud has no text for it in any language. Observed 2026-11-17.
  REG_HEATING_HEAT_CURVE1_CONSTANT:
    kind: number
    unit: "°C"
    device_class: temperature
    default_enabled: true
    risk: heating
    translation_key: constant_temperature
    state_dependent: true

  # circuit mode: the cloud label says "Aktivovat", the values are OFF (hidden) / Curve / Constant
  REG_ACTIVATE_CIRC1:
    kind: select
    translation_key: circuit_mode
    risk: heating

  # --- operation modes: the same name exists in two groups ---
  REG_GROUP_OPERATIONAL_OPERATION/REG_OPERATIONMODE:
    kind: select
    translation_key: operation_mode
    default_enabled: true
    risk: heating  # OFF is exposed without extra confirmation (DECISIONS D6)
  REG_GROUP_HOT_WATER/REG_OPERATIONMODE:
    kind: select
    translation_key: hot_water_mode
    default_enabled: true
    risk: none
    state_dependent: true

  # --- hot water ---
  REG_HOT_WATER_STATUS:
    kind: switch
    risk: none
    translation_key: hot_water
    default_enabled: true
  REG_HOT_WATER_TEMPERATURE:
    kind: sensor
    translation_key: hot_water_temperature
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_SER_HOT_WATER_TOPH_INTER:  # REG_SER_* defaults to risk "service"; this one is harmless
    kind: number
    unit: d
    risk: none
    translation_key: hot_water_boost_interval
    state_dependent: true

  # --- registers with modifier 1 that are NOT temperatures (seen in other families' dumps) ---
  # `unit: ""` = explicitly unitless; without it the modifier hint would make them degrees
  REG_HEATING_ROOM_FACTOR:
    kind: number
    unit: ""
    risk: heating
  REG_ROOM_FACTOR:
    kind: number
    unit: ""
    risk: heating
  REG_HEATING_CURVE_PLUS5:
    kind: number
    unit: ""
    risk: heating
  REG_HEATING_CURVE_0:
    kind: number
    unit: ""
    risk: heating
  REG_HEATING_CURVE_MINUS5:
    kind: number
    unit: ""
    risk: heating
  REG_CURVE_MINUS_5:
    kind: number
    unit: ""
    risk: heating

  # --- hot water boost (the cloud spelled it with a double underscore until firmware 17) ---
  REG_HOT_WATER_BOOST:
    kind: switch
    risk: none
    default_enabled: true
    translation_key: hot_water_boost
  REG__HOT_WATER_BOOST:
    kind: switch
    risk: none
    default_enabled: true
    translation_key: hot_water_boost

  # --- temperatures ---
  REG_OPER_DATA_OUTDOOR_TEMP_MA_SA:
    kind: sensor
    translation_key: outdoor_temperature
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_OPER_DATA_SUPPLY_MA_SA:
    kind: sensor
    translation_key: supply_temperature
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_DESIRED_SUPPLY_LINE_TEMP:
    kind: sensor
    translation_key: desired_supply_temperature
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_DESIRED_SYS_SUPPLY_LINE_TEMP:
    kind: sensor
    translation_key: desired_system_supply_temperature
    unit: "°C"
    device_class: temperature
    state_class: measurement
  REG_INDOOR_TEMPERATURE:
    kind: sensor
    translation_key: indoor_temperature
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
    needs_indoor_sensor: true
  REG_OPER_DATA_DISTR_CIR1:  # lives in the temperatures group but belongs to circuit 1
    kind: sensor
    translation_key: circuit_supply_temperature
    unit: "°C"
    device_class: temperature
    state_class: measurement
    device: circuit_1
    default_enabled: true

  # --- operating hours (group REG_GROUP_OPERATIONAL_TIME is diagnostic) ---
  REG_OPER_TIME_COMPRESSOR:
    kind: sensor
    translation_key: hours_compressor
    unit: h
    device_class: duration
    state_class: total_increasing
    default_enabled: true
  REG_OPER_TIME_HEATING:
    kind: sensor
    translation_key: hours_heating
    unit: h
    device_class: duration
    state_class: total_increasing
    default_enabled: true
  REG_OPER_TIME_HOT_WATER:
    kind: sensor
    translation_key: hours_hot_water
    unit: h
    device_class: duration
    state_class: total_increasing
    default_enabled: true
  REG_OPER_TIME_IMM1:
    kind: sensor
    translation_key: hours_aux_1
    unit: h
    device_class: duration
    state_class: total_increasing
    default_enabled: true  # when the electric aux heater runs: worth a history
  REG_OPER_TIME_IMM2:
    kind: sensor
    translation_key: hours_aux_2
    unit: h
    device_class: duration
    state_class: total_increasing
    default_enabled: true  # when the electric aux heater runs: worth a history


  # ===== Other model families =====================================================================
  # Register names seen in dumps of ATEC, Diplomat, NCP/Atlas and iTec from the OLDER cloud (before
  # September 2026), see NOTICE.md. Names are stable, but units/defaults are educated: sensors are
  # degrees from the modifier, anything uncertain starts disabled. Extend with real diagnostics.
  REG_OPER_DATA_RETURN_MA_SA:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_OPER_DATA_RETURN:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_RETURN_LINE:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_SUPPLY_LINE:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_DESIRED_SUPPLY_LINE:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: false
  REG_OUTDOOR_TEMPERATURE:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_BRINE_IN:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_BRINE_OUT:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_OPER_DATA_BUFFER_TANK:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_DESIRED_BUFFRER_TANK:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: false
  REG_DESIRED_INDOOR_TEMPERATURE:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: false
  REG_COOL_SENSOR_TANK:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: false
  REG_COOL_SENSOR_SUPPLY:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: false
  OPER_DATA_TANK:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
    translation_key: tank_temperature
  REG_ACTUAL_POOL_TEMP:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
  REG_DESIRED_DISTR_CIR1:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: false
    device: circuit_1
  REG_DESIRED_DISTR_CIR2:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: false
    device: circuit_2
  REG_OPER_DATA_DISTR_CIR2:
    kind: sensor
    unit: "°C"
    device_class: temperature
    state_class: measurement
    default_enabled: true
    device: circuit_2
  REG_OPER_TIME_COOLING:
    kind: sensor
    unit: h
    device_class: duration
    state_class: total_increasing
    default_enabled: false
  REG_OPER_TIME_IMM3:
    kind: sensor
    unit: h
    device_class: duration
    state_class: total_increasing
    default_enabled: true
  REG_INTEGRAL_LSD:
    kind: sensor
    unit: ""
    category: diagnostic
  REG_DEFROSTS_MA_SA:
    kind: sensor
    unit: ""
    state_class: total_increasing
    category: diagnostic
  REG_DEFROSTS_BETW2DEFR_MA_SA:
    kind: sensor
    unit: h
    category: diagnostic
  REG_DEFROST_TIME_LAST_DEFROST_MA_SA:
    kind: sensor
    unit: min
    category: diagnostic
  REG_CURRENT_LIMITER_EXP_PORT203_1:
    kind: sensor
    category: diagnostic
  REG_SER_HEATING_INTEGRALA1:
    kind: number
    risk: service
  REG_ROOM_SENSOR_ENABLE:
    kind: switch
    risk: heating
  REG_LINK_INTEGRATION:  # values LIGHT / SYSTEM, not an on/off pair
    kind: select
    risk: none

  # --- heating: other names for the same settings, and circuit 2 ---
  REG_HEATING_STOP:  # Diplomat's name of REG_HEATING_HEAT_STOP
    kind: number
    unit: "°C"
    device_class: temperature
    risk: heating
  REG_CURVE2_CURVE:
    kind: number
    unit: "°C"
    device_class: temperature
    default_enabled: true
    risk: heating
    translation_key: heating_curve
    state_dependent: true
  REG_CURVE2_MIN:
    kind: number
    unit: "°C"
    device_class: temperature
    risk: heating
    translation_key: heating_curve_min
    state_dependent: true
  REG_CURVE2_MAX:
    kind: number
    unit: "°C"
    device_class: temperature
    risk: heating
    translation_key: heating_curve_max
    state_dependent: true
  REG_SHUNT_COOLING:
    kind: number
    unit: "°C"
    device_class: temperature
    risk: heating
  REG_ACTIVATE_COOLING:
    kind: switch
    risk: heating

  # --- status registers of other families (a flag per entity) ---
  COMP_STATUS_ATEC:
    kind: binary_sensor
    default_enabled: true
    core_flags: [COMP_VALUE_COMPR, COMP_VALUE_HEATING, COMP_VALUE_HOT_WATER, COMP_VALUE_DEFROST]
  COMP_STATUS:  # Diplomat
    kind: binary_sensor
    default_enabled: true
    core_flags: [COMP_VALUE_COMPR, COMP_VALUE_HEATING, COMP_VALUE_HOT_WATER]
  COMP_POWER_STATUS:  # Diplomat: stages of the electric auxiliary heater (3/6/9/12/15 kW)
    kind: binary_sensor
    default_enabled: true
  COMP_POWER_STATUS_ATEC:
    kind: binary_sensor
    default_enabled: true
  REG_OPERATIONAL_STATUS_PRIORITY_BITMASK:  # NCP / Atlas: what the pump is doing, as a bitmask
    kind: binary_sensor
    default_enabled: true
    core_flags: [REG_VALUE_STATUS_DEFROST, REG_VALUE_STATUS_HOTWATER, REG_VALUE_STATUS_HEAT]

  # --- status ---
  COMP_STATUS_ITEC:  # bitmask: one binary sensor per flag
    kind: binary_sensor
    default_enabled: true
    core_flags:  # enabled even while the cloud hides them (hot water: hidden while it is off)
      - COMP_VALUE_COMPR
      - COMP_VALUE_HEATING
      - COMP_VALUE_HOT_WATER
      - COMP_VALUE_DEFROST
  COMP_HAS_LINK:  # hidden helper, meaning unknown (API-NOTES section 10)
    kind: skip

  # "Heat demand": gone from the cloud since 2026-09-18, unit and range unverified (roadmap P0.9)
  REG_PID:
    kind: sensor
    state_class: measurement
