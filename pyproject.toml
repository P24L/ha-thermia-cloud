[project]
name = "ha-thermia-cloud"
version = "0.0.0"
description = "Home Assistant integration for the Thermia Online cloud (unofficial)"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
# Dependencies are managed through requirements_test.txt and the integration manifest.

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/thermia_cloud/client", "custom_components/thermia_cloud/catalog"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
